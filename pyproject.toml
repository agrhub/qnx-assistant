[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnx-port-assistant"
version = "0.1.0"
description = "Find, fix and verify what keeps a Linux C/C++ project from running on QNX 8.0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-c>=0.23",
  "tree-sitter-cpp>=0.23",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qpa = "qpa.cli:app"

[tool.setuptools.packages.find]
include = ["qpa*"]

[tool.setuptools.package-data]
qpa = ["rules/*.yaml"]
